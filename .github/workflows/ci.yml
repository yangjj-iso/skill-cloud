name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: server (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      GOTOOLCHAIN: local
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: skillcloud
          POSTGRES_PASSWORD: skillcloud
          POSTGRES_DB: skillcloud_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U skillcloud"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: server/go.sum
      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt found unformatted files:"
            echo "$unformatted"
            exit 1
          fi
      - run: go vet ./...
      - run: go build ./...
      - name: Unit tests
        run: go test -race -count=1 ./...
      - name: Integration tests (Postgres)
        env:
          SKILLCLOUD_TEST_DSN: postgres://skillcloud:skillcloud@localhost:5432/skillcloud_test?sslmode=disable
        run: go test -tags=integration -count=1 ./...

  cli:
    name: cli/skill (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli/skill
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: cli/skill/go.sum
      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt found unformatted files:"
            echo "$unformatted"
            exit 1
          fi
      - run: go vet ./...
      - run: go build ./...
      - name: Unit tests
        run: go test -race -count=1 ./...

  python-sdk:
    name: sdk/python
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Tests
        run: pytest -q

  typescript-sdk:
    name: sdk/typescript
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Type-check
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
