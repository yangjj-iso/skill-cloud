apiVersion: 1

datasources:
  - name: Prometheus
    # The bundled dashboard panels reference the datasource by uid via
    # `{"type": "prometheus", "uid": "prometheus"}` — keep this uid pinned
    # so the dashboards bind to it. Without an explicit uid, Grafana
    # generates a random one on first boot and the dashboard panels render
    # "No data" / "Unauthorized" because they reference a non-existent uid.
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
