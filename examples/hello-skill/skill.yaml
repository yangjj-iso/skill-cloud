name: hello
namespace: acme
version: 0.1.0
description: "A minimal docker-runtime skill that returns 'hello, {name}'."
tags: [example, demo]

runtime:
  type: docker
  image: python:3.12-slim
  entrypoint: "python -m hello"
  timeout_seconds: 10

inputs:
  name:
    type: string
    description: "Name to greet."
    required: true

outputs:
  message:
    type: string
