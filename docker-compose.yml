services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: skillcloud
      POSTGRES_PASSWORD: skillcloud
      POSTGRES_DB: skillcloud
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skillcloud"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    environment:
      SKILLCLOUD_DB_DSN: "postgres://skillcloud:skillcloud@postgres:5432/skillcloud?sslmode=disable"
      SKILLCLOUD_S3_ENDPOINT: "http://minio:9000"
      SKILLCLOUD_S3_ACCESS_KEY: "minioadmin"
      SKILLCLOUD_S3_SECRET_KEY: "minioadmin"
      SKILLCLOUD_S3_BUCKET: "skillcloud"
      SKILLCLOUD_LISTEN_ADDR: ":8080"
      # The dispatcher shells out to this binary to spawn skill containers.
      # The CLI talks to the host's docker daemon over the bind-mounted socket
      # below so the spawned skill containers run as siblings of this server
      # (not nested inside it). This pattern is convenient for local dev but
      # NOTE: mounting the docker socket grants the server container root-
      # equivalent control of the host; do not deploy this compose file
      # untouched to a shared / production host.
      SKILLCLOUD_DOCKER_BINARY: "docker"
    ports:
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    # Add the host's docker GID so the non-root user inside the container
    # can talk to the bind-mounted socket. Override via `DOCKER_GID=$(stat -c
    # '%g' /var/run/docker.sock) docker compose up` when the host uses a
    # non-default GID (e.g. some CI runners, rootless docker).
    group_add:
      - "${DOCKER_GID:-999}"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

volumes:
  postgres_data:
  minio_data:
